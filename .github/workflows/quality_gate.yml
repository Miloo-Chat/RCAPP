name: Quality Gate & CI Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Build, SEO, A11y, Lychee & Lighthouse CI Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Verify Zero Bots & Automated Chat Partners (No-Bots Guard)
        run: |
          bash scripts/no-bots-check.sh

      - name: Verify Ad Isolation Integrity
        run: |
          node tests/test_ad_isolation.cjs

      - name: Build Application & Static Prerender
        run: |
          cd client
          npm run build

      - name: Run Content Quality & Word Count Audit
        run: |
          node tests/qa_content_audit.cjs

      - name: Verify Internal Links & Crawl Reachability
        run: |
          node tests/verify_crawl.cjs

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir client/dist --no-progress client/dist
          fail: true

      - name: Start Preview Web Server
        run: |
          cd client
          npx vite preview --port 4173 &
          sleep 3

      - name: Run pa11y Accessibility Audit
        run: |
          node tests/test_a11y.cjs

      - name: Run Lighthouse CI with Strict Budgets
        run: |
          node tests/run_lighthouse.cjs

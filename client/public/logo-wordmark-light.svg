<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap');
      .brand-text {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 52px;
        font-weight: 600;
        letter-spacing: -0.02em;
        fill: #1A1A1A;
      }
    </style>
  </defs>
  <!-- Text 'miloo' -->
  <text x="16" y="50" class="brand-text">miloo</text>
  <!-- Coral Dot -->
  <circle cx="166" cy="48" r="4.5" fill="#D95236" />
  <!-- Thin ink wire passing through both 'o's (x ~95 to ~160, y ~35) -->
  <path d="M 88 35.5 Q 124 37 160 36" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round" />
  <!-- Tiny perched bird on wire above second 'o' -->
  
<g transform="translate(136, 35.5) scale(1.05)">
  <!-- Bird body -->
  <path d="M -1 -7 C -2 -7.5 -3.5 -7.5 -4 -6 C -4.5 -5 -4 -4 -3 -3.5 C -4.5 -3 -5 -1.5 -4.8 0 C -4.5 1 -3.5 1 -2 0.5 C -1.5 1.5 -1.2 3.5 -1.5 5 C -1 5 -0.5 4 -0.2 2.5 C 0.5 0.5 1.5 0 2 -0.2 C 3.2 -0.8 3.5 -2.2 3.2 -3.8 C 2.8 -5.5 1.5 -6.8 -1 -7 Z" fill="#1A1A1A" />
  <!-- Beak -->
  <path d="M -4 -6 L -6 -6 L -4 -5.2 Z" fill="#1A1A1A" />
  <!-- Eye -->
  <circle cx="-2.6" cy="-5.8" r="0.4" fill="#ffffff" />
  <!-- Legs -->
  <line x1="-1.5" y1="-0.8" x2="-1.5" y2="0" stroke="#1A1A1A" stroke-width="0.6" stroke-linecap="round" />
  <line x1="0.5" y1="-0.8" x2="0.5" y2="0" stroke="#1A1A1A" stroke-width="0.6" stroke-linecap="round" />
</g>

</svg>